# Temporary, branch-scoped workflow to regenerate the pnpm lockfile from the npm registry.
# Remove this file from the branch once the lockfile commit is verified.
name: Security lockfile sync (temporary)

on:
  push:
    branches:
      - fix/security-next-react-20261120

permissions:
  contents: write

concurrency:
  group: security-lockfile-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    # GITHUB_TOKEN commits do not initiate additional GitHub Actions runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Regenerate lockfile without lifecycle scripts
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
          node -e "const p=require('./package.json'); for(const [k,v] of Object.entries({next:'16.4.6',react:'19.2.9','react-dom':'19.2.9','eslint-config-next':'16.4.6'})){const a=p.dependencies[k]||p.devDependencies[k]; if(a!==v) throw new Error(k+': '+a)}"
          git diff --check
          git diff --exit-code -- package.json

      - name: Commit only the regenerated pnpm-lock.yaml
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "chore(deps): regenerate lockfile for patched runtime"
          git push origin HEAD:fix/security-next-react-20261120

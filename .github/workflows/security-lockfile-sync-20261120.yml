# One-time branch-scoped lockfile regeneration and dependency audit. Remove after the run.
name: Security lockfile and audit (temporary)
on:
  push:
    branches:
      - fix/security-next-react-20261120

permissions:
  contents: write

jobs:
  lockfile-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Regenerate lockfile and assert package versions
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./package.json')
          for(const [name,expected] of Object.entries({
            next:'16.4.6', react:'19.2.9', 'react-dom':'19.2.9', 'eslint-config-next':'16.4.6'
          })){
            const got=JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json','utf8')).version
            if(got!==expected) throw new Error(name+': '+got+' expected '+expected)
            console.log(name,got)
          }
          if(pkg.dependencies.shadcn || pkg.devDependencies.shadcn === undefined) throw new Error('shadcn must be dev-only')
          NODE
          git diff --check
          git diff --exit-code -- package.json
      - name: Commit lockfile only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- pnpm-lock.yaml
            git commit -m "chore(deps): update lockfile after production dependency audit"
            git push origin HEAD:fix/security-next-react-20261120
          fi
      - name: Audit production dependency advisories
        run: pnpm audit --prod --audit-level high
